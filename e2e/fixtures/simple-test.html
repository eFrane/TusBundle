<!DOCTYPE html>
<html>
<head>
    <title>TUS Bundle E2E Test</title>
</head>
<body>
    <h1>TUS Bundle E2E Test</h1>
    <div id="result"></div>
    <script>
        // Test the TUS endpoint directly
        const endpoint = window.location.origin + '/_tus/upload';

        fetch(endpoint, {
            method: 'POST',
            headers: {
                'Tus-Resumable': '1.0.0',
                'Upload-Metadata': 'filename test.txt,filetype text/plain',
                'Upload-Length': '5'
            }
        })
        .then(response => response.text())
        .then(text => {
            document.getElementById('result').textContent = 'TUS endpoint responded: ' + text;
            window.tusResponse = text;
        })
        .catch(error => {
            document.getElementById('result').textContent = 'Error: ' + error.message;
            window.tusError = error.message;
        });

        window.endpoint = endpoint;
        window.testReady = true;
    </script>
</body>
</html>
